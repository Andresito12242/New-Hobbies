<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Hobbies - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container text-center mt-5 pt-5">
        <h1 class="display-4 fw-bold text-primary mb-3">New Hobbies 🎯</h1>
        <p class="lead text-secondary mb-5">
            Descubre tu próximo pasatiempo ideal impulsado por tecnologías de la Web Semántica.
        </p>

        <div class="card shadow-sm p-5 mx-auto" style="max-width: 600px;">
            {% if user.is_authenticated %}
                <h3 class="mb-4">¡Hola, {{ user.username }}! 👋</h3>
                <div class="d-grid gap-3 col-8 mx-auto">
                    <a href="{% url 'registro_perfil' %}" class="btn btn-success btn-lg">Ir a mi Perfil de Hobbies</a>
                    
                    <form action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-danger w-100 mt-2">Cerrar Sesión</button>
                    </form>
                </div>

            {% else %}
                <h4 class="mb-4 text-muted">¿Listo para empezar?</h4>
                <div class="d-grid gap-3 col-8 mx-auto">
                    <a href="{% url 'login' %}" class="btn btn-primary btn-lg">Iniciar Sesión</a>
                    <a href="{% url 'registro_usuario' %}" class="btn btn-outline-secondary btn-lg">Crear Cuenta nueva</a>
                </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
