<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recomendaciones Semánticas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container text-center mt-5 pt-5">
        <h1 class="display-5 fw-bold text-success mb-3">¡Perfil analizado, {{ nombre }}! 🧠</h1>
        <p class="lead text-secondary mb-5">
            Nuestro Agente Inteligente consultó el grafo de conocimiento y encontró las siguientes opciones ideales para ti:
        </p>

        <div class="card shadow-sm p-4 mx-auto" style="max-width: 600px;">
            <ul class="list-group list-group-flush text-start fs-5">
                {% for rec in recomendaciones %}
                    <li class="list-group-item py-3">🎯 {{ rec }}</li>
                {% endfor %}
            </ul>
        </div>
        
        <div class="mt-5">
            <a href="{% url 'inicio' %}" class="btn btn-outline-primary btn-lg">Volver al Inicio</a>
        </div>
    </div>
</body>
</html>
