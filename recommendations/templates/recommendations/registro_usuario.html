<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Cuenta - New Hobbies</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; padding-top: 50px; }
        .auth-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 auth-box">
                <h2 class="text-center text-primary mb-4">Únete a New Hobbies</h2>
                <form method="post">
                    {% csrf_token %}
                    
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger mt-1" style="font-size: 0.85em;">
                                    {{ field.errors|striptags }}
                                </div>
                            {% endif %}
                        </div>
                    {% endfor %}

                    <button type="submit" class="btn btn-success w-100 mt-4">Crear Mi Cuenta</button>
                </form>
                <div class="text-center mt-3">
                    <p class="text-muted">¿Ya tienes cuenta? <a href="{% url 'login' %}" class="text-decoration-none">Inicia Sesión aquí</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
